name: Verify submission

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make install
      - run: make lint
      - run: make test
        if: ${{ !cancelled() }}

  subject:
    name: Subject submission gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: make install
      - name: Export the exact tested revision
        run: .venv/bin/python -m tools.export_submission "$RUNNER_TEMP/submission"
      - name: Lint the exported files
        run: make -C "$RUNNER_TEMP/submission" lint PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
      - name: Verify README, imports, docstrings and movement streams
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m tools.verify_subject "$RUNNER_TEMP/submission"
